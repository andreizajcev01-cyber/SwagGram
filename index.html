<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SwagGram</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SwagGram">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#17212b">
<link rel="apple-touch-icon" id="ico" href="">
<style>
:root{--bg:#17212b;--bg2:#0e1621;--in:#182533;--out:#2b5278;--ac:#5288c1;--tx:#f5f5f5;--mu:#6d7f8f;--ln:#0b121a;--hv:#202b36}
body[data-t=light]{--bg:#fff;--bg2:#d9e4ec;--in:#fff;--out:#eeffde;--ac:#3390ec;--tx:#111;--mu:#7a8a96;--ln:#e6e9ec;--hv:#f1f3f5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,"SF Pro Text",Roboto,"Segoe UI",sans-serif;overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.hide{display:none!important}
.av{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:19px}
.av.s{width:40px;height:40px;font-size:16px}.av.l{width:90px;height:90px;font-size:34px}
/* auth */
#auth{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#auth .logo{width:110px;height:110px;border-radius:50%;background:var(--ac);display:grid;place-items:center;margin-bottom:18px}
#auth h1{margin:0 0 6px;font-size:26px}
#auth p{margin:0 0 22px;color:var(--mu)}
#auth form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.f{width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--ln);background:transparent;outline:0}
.f:focus{border-color:var(--ac)}
.btn{background:var(--ac);color:#fff;padding:14px;border-radius:12px;font-weight:600}
.lnk{color:var(--ac);padding:10px}
.err{color:#ec5b5b;min-height:18px;font-size:14px}
/* app */
#app{height:100%;display:flex;position:relative}
#list{width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:var(--bg);min-height:56px}
.top h2{margin:0;font-size:19px;flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--mu)}
.ib:active{background:var(--hv)}
.srch{margin:0 12px 8px;padding:10px 14px;border-radius:22px;border:0;background:var(--bg2);outline:0}
#rows{flex:1;overflow-y:auto}
.row{display:flex;gap:12px;padding:9px 14px;align-items:center;cursor:pointer;width:100%;text-align:left}
.row:active,.row.on{background:var(--hv)}
.row .m{flex:1;min-width:0}
.row .n{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.row .n span:last-child{font-weight:400;font-size:13px;color:var(--mu)}
.row .l{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:15px}
.sec{padding:8px 14px;color:var(--ac);font-size:14px;font-weight:600}
.empty{padding:40px 24px;text-align:center;color:var(--mu)}
/* chat */
#chat{position:absolute;inset:0;background:var(--bg2);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s ease;z-index:5}
#chat.open{transform:none}
#chat .top{border-bottom:1px solid var(--ln)}
#chat .t1{font-weight:600;line-height:1.15}
#chat .t2{font-size:13px;color:var(--mu)}
#msgs{flex:1;overflow-y:auto;padding:10px 10px 6px;display:flex;flex-direction:column;gap:3px}
.b{max-width:80%;padding:7px 10px 5px;border-radius:14px;background:var(--in);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap}
.b.o{align-self:flex-end;background:var(--out);border-bottom-right-radius:4px}
.b.i{align-self:flex-start;border-bottom-left-radius:4px}
.b small{display:block;text-align:right;font-size:11px;color:var(--mu);margin-top:1px;opacity:.85}
.none{margin:auto;padding:6px 14px;border-radius:14px;background:rgba(0,0,0,.25);color:#fff;font-size:14px}
#bar{display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);background:var(--bg)}
#bar textarea{flex:1;resize:none;max-height:120px;border:0;outline:0;background:var(--bg2);border-radius:20px;padding:10px 14px;height:42px}
#send{width:42px;height:42px;border-radius:50%;background:var(--ac);display:grid;place-items:center}
/* settings */
#set{position:absolute;inset:0;background:var(--bg2);z-index:6;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .22s ease;overflow-y:auto}
#set.open{transform:none}
.card{background:var(--bg);padding:16px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px}
.card label{font-size:13px;color:var(--ac)}
.card .f{padding:10px 0;border:0;border-bottom:1px solid var(--ln);border-radius:0}
.sw{display:flex;justify-content:space-between;align-items:center}
.red{color:#ec5b5b;text-align:left;padding:6px 0}
#empty{display:none}
@media(min-width:800px){
 #list{width:350px;border-right:1px solid var(--ln);flex:none}
 #chat{left:350px;transform:none}
 #chat.idle #msgs,#chat.idle .top,#chat.idle #bar{visibility:hidden}
 #set{right:auto;width:350px}
 #empty{display:block;position:absolute;left:350px;right:0;top:50%;text-align:center;color:#fff;z-index:4}
}
</style>
</head>
<body>
<section id="auth" class="hide">
 <div class="logo"><svg width="56" height="56" viewBox="0 0 24 24" fill="#fff"><path d="M21.5 3.2 2.6 10.5c-.9.4-.9 1.2-.2 1.4l4.8 1.5 1.9 5.8c.2.6.4.8.9.8.4 0 .6-.2.9-.5l2.3-2.2 4.7 3.5c.9.5 1.5.2 1.7-.8L22.9 4.6c.3-1.2-.5-1.8-1.4-1.4zM9 14l9.2-5.8c.4-.3.8-.1.5.2L11 15.5l-.3 3.3L9 14z"/></svg></div>
 <h1 id="at">Вход в SwagGram</h1>
 <p id="as">Введите свой @юзернейм и пароль</p>
 <form id="af">
  <input class="f" id="nm" placeholder="Имя" autocomplete="name" maxlength="30">
  <input class="f" id="un" placeholder="@юзернейм" autocapitalize="none" autocorrect="off" maxlength="20" autocomplete="username">
  <input class="f" id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
  <div class="err" id="er"></div>
  <button class="btn" id="ab">Войти</button>
  <button type="button" class="lnk" id="sw1">Создать аккаунт</button>
 </form>
</section>

<section id="app" class="hide">
 <div id="list">
  <div class="top">
   <button class="ib" id="menu" aria-label="Настройки"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg></button>
   <h2>SwagGram</h2>
  </div>
  <input class="srch" id="q" placeholder="Поиск по имени или @юзернейму" autocapitalize="none">
  <div id="rows"></div>
  <div id="set">
   <div class="top"><button class="ib" id="sb" aria-label="Назад"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button><h2>Настройки</h2></div>
   <div class="card" style="align-items:center"><div class="av l" id="sav"></div><div id="sn" style="font-weight:600;font-size:19px"></div><div id="su" style="color:var(--mu)"></div></div>
   <div class="card">
    <label>Имя</label><input class="f" id="s1" maxlength="30">
    <label>Юзернейм</label><input class="f" id="s2" maxlength="20" autocapitalize="none">
    <label>О себе</label><input class="f" id="s3" maxlength="70" placeholder="Расскажите о себе">
    <div class="err" id="se"></div>
    <button class="btn" id="ss">Сохранить</button>
   </div>
   <div class="card">
    <div class="sw"><span>Тёмная тема</span><input type="checkbox" id="th" style="width:22px;height:22px"></div>
    <button class="red" id="out">Выйти из аккаунта</button>
   </div>
  </div>
 </div>
 <div id="empty"><span class="none">Выберите, кому написать</span></div>
 <div id="chat" class="idle">
  <div class="top">
   <button class="ib" id="back" aria-label="Назад"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg></button>
   <div class="av s" id="cav"></div>
   <div><div class="t1" id="cn"></div><div class="t2" id="cu"></div></div>
  </div>
  <div id="msgs"></div>
  <div id="bar"><textarea id="tx" rows="1" placeholder="Сообщение"></textarea><button id="send" aria-label="Отправить"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button></div>
 </div>
</section>

<script>
const $=s=>document.querySelector(s),LS=window.localStorage;
let db={users:{},msgs:[]},me=null,cur=null,reg=false;
const COL=['#e17076','#faa774','#a695e7','#7bc862','#6ec9cb','#65aadd','#ee7aae'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash=s=>{let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return h.toString(36)};
const col=u=>COL[parseInt(hash(u),36)%7];
const ini=n=>(n||'?').trim().slice(0,1).toUpperCase();
const hm=t=>new Date(t).toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
function load(){try{db=JSON.parse(LS.getItem('sg_db'))||db}catch(e){}try{me=LS.getItem('sg_me')}catch(e){}if(me&&!db.users[me])me=null}
function save(){try{LS.setItem('sg_db',JSON.stringify(db))}catch(e){}}
function nm(u){return u===me?'Избранное':(db.users[u]?db.users[u].name:u)}
function av(el,u){el.style.background=u===me?'#5288c1':col(u);el.textContent=u===me?'★':ini(db.users[u]?db.users[u].name:u)}

/* auth */
function authMode(r){reg=r;$('#nm').classList.toggle('hide',!r);$('#at').textContent=r?'Регистрация':'Вход в SwagGram';$('#as').textContent=r?'Придумайте имя, @юзернейм и пароль':'Введите свой @юзернейм и пароль';$('#ab').textContent=r?'Создать аккаунт':'Войти';$('#sw1').textContent=r?'Уже есть аккаунт? Войти':'Создать аккаунт';$('#er').textContent=''}
$('#sw1').onclick=()=>authMode(!reg);
$('#af').onsubmit=e=>{
 e.preventDefault();load();
 const u=$('#un').value.trim().replace(/^@/,'').toLowerCase(),p=$('#pw').value,n=$('#nm').value.trim(),er=$('#er');
 if(!/^[a-z][a-z0-9_]{3,19}$/.test(u))return er.textContent='Юзернейм: 4–20 символов, латиница, цифры и _, начинается с буквы';
 if(reg){
  if(!n)return er.textContent='Введите имя';
  if(p.length<6)return er.textContent='Пароль должен быть не короче 6 символов';
  if(db.users[u])return er.textContent='Этот юзернейм уже занят';
  db.users[u]={name:n,bio:'',pass:hash(p)};save();
 }else{
  if(!db.users[u]||db.users[u].pass!==hash(p))return er.textContent='Неверный юзернейм или пароль';
 }
 me=u;try{LS.setItem('sg_me',u)}catch(e){}
 $('#pw').value='';start();
};

/* list */
function lastOf(){
 const m={};
 db.msgs.forEach(x=>{if(x.from!==me&&x.to!==me)return;const o=x.from===me?x.to:x.from;if(!m[o]||m[o].t<x.t)m[o]=x});
 if(!m[me])m[me]={text:'Сохраняйте сюда заметки',t:0};
 return Object.entries(m).sort((a,b)=>b[1].t-a[1].t);
}
function rowHtml(u,sub,time){return `<button class="row${u===cur?' on':''}" data-u="${esc(u)}"><div class="av" style="background:${u===me?'#5288c1':col(u)}">${u===me?'★':esc(ini(db.users[u]&&db.users[u].name))}</div><div class="m"><div class="n"><span>${esc(nm(u))}</span><span>${time||''}</span></div><div class="l">${esc(sub)}</div></div></button>`}
function renderList(){
 const q=$('#q').value.trim().replace(/^@/,'').toLowerCase();let h='';
 if(!q){
  lastOf().forEach(([u,x])=>{h+=rowHtml(u,(x.from===me&&u!==me?'Вы: ':'')+x.text,x.t?hm(x.t):'')});
 }else{
  const f=Object.keys(db.users).filter(u=>u!==me&&(u.includes(q)||db.users[u].name.toLowerCase().includes(q)));
  h=f.length?'<div class="sec">Люди</div>'+f.map(u=>rowHtml(u,'@'+u+(db.users[u].bio?' · '+db.users[u].bio:''),'')).join(''):'<div class="empty">Никого не найдено.<br>Проверьте юзернейм.</div>';
 }
 $('#rows').innerHTML=h;
}
$('#q').oninput=renderList;
$('#rows').onclick=e=>{const r=e.target.closest('.row');if(r)openChat(r.dataset.u)};

/* chat */
function openChat(u){
 cur=u;$('#q').value='';const c=$('#chat');c.classList.remove('idle');c.classList.add('open');
 av($('#cav'),u);$('#cn').textContent=nm(u);
 $('#cu').textContent=u===me?'Личные заметки':'@'+u+(db.users[u]&&db.users[u].bio?' · '+db.users[u].bio:'');
 renderMsgs();renderList();
 if(innerWidth>=800)$('#tx').focus();
}
function renderMsgs(){
 if(!cur)return;
 const a=db.msgs.filter(x=>cur===me?(x.from===me&&x.to===me):((x.from===me&&x.to===cur)||(x.from===cur&&x.to===me)));
 $('#msgs').innerHTML=a.length?a.map(x=>`<div class="b ${x.from===me?'o':'i'}">${esc(x.text)}<small>${hm(x.t)}</small></div>`).join(''):'<div class="none">Сообщений пока нет. Напишите первым!</div>';
 const m=$('#msgs');m.scrollTop=m.scrollHeight;
}
function send(){
 const t=$('#tx').value.trim();if(!t||!cur)return;
 load();db.msgs.push({from:me,to:cur,text:t,t:Date.now()});save();
 $('#tx').value='';$('#tx').style.height='42px';renderMsgs();renderList();
}
$('#send').onclick=send;
$('#tx').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&innerWidth>=800){e.preventDefault();send()}};
$('#tx').oninput=e=>{const t=e.target;t.style.height='42px';t.style.height=Math.min(t.scrollHeight,120)+'px'};
$('#back').onclick=()=>{cur=null;$('#chat').classList.remove('open');renderList()};

/* settings */
function fillSet(){const x=db.users[me];av($('#sav'),me);$('#sav').style.background=col(me);$('#sav').textContent=ini(x.name);$('#sn').textContent=x.name;$('#su').textContent='@'+me;$('#s1').value=x.name;$('#s2').value=me;$('#s3').value=x.bio||'';$('#se').textContent='';$('#th').checked=document.body.dataset.t!=='light'}
$('#menu').onclick=()=>{fillSet();$('#set').classList.add('open')};
$('#sb').onclick=()=>$('#set').classList.remove('open');
$('#ss').onclick=()=>{
 load();const n=$('#s1').value.trim(),u=$('#s2').value.trim().replace(/^@/,'').toLowerCase(),b=$('#s3').value.trim(),er=$('#se');
 if(!n)return er.textContent='Имя не может быть пустым';
 if(!/^[a-z][a-z0-9_]{3,19}$/.test(u))return er.textContent='Юзернейм: 4–20 символов, латиница, цифры и _';
 if(u!==me&&db.users[u])return er.textContent='Этот юзернейм уже занят';
 const x=db.users[me];x.name=n;x.bio=b;
 if(u!==me){db.users[u]=x;delete db.users[me];db.msgs.forEach(m=>{if(m.from===me)m.from=u;if(m.to===me)m.to=u});if(cur===me)cur=u;me=u;try{LS.setItem('sg_me',u)}catch(e){}}
 save();fillSet();er.textContent='Сохранено';er.style.color='#6ec96e';setTimeout(()=>{er.textContent='';er.style.color=''},1500);renderList();if(cur)openChat(cur);
};
function theme(light){document.body.dataset.t=light?'light':'dark';$('meta[name=theme-color]').content=light?'#ffffff':'#17212b';try{LS.setItem('sg_th',light?'l':'d')}catch(e){}}
$('#th').onchange=e=>theme(!e.target.checked);
$('#out').onclick=()=>{try{LS.removeItem('sg_me')}catch(e){}me=null;cur=null;$('#set').classList.remove('open');$('#chat').classList.remove('open');$('#app').classList.add('hide');$('#auth').classList.remove('hide');authMode(false)};

function start(){$('#auth').classList.add('hide');$('#app').classList.remove('hide');cur=null;$('#chat').classList.remove('open');$('#chat').classList.add('idle');renderList()}
window.addEventListener('storage',()=>{if(!me)return;load();if(!me)return;renderList();renderMsgs()});

/* PWA: icon + manifest without extra files */
(function(){
 try{
  const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#5288c1';x.fillRect(0,0,180,180);x.fillStyle='#fff';
  x.beginPath();x.moveTo(145,38);x.lineTo(35,85);x.lineTo(62,96);x.lineTo(145,38);x.fill();
  x.beginPath();x.moveTo(145,38);x.lineTo(70,104);x.lineTo(74,138);x.lineTo(92,116);x.lineTo(120,138);x.closePath();x.fill();
  const url=c.toDataURL('image/png');$('#ico').href=url;
  const mf={name:'SwagGram',short_name:'SwagGram',display:'standalone',background_color:'#17212b',theme_color:'#17212b',start_url:location.href.split('#')[0],icons:[{src:url,sizes:'180x180',type:'image/png'}]};
  const l=document.createElement('link');l.rel='manifest';l.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/json'}));document.head.appendChild(l);
 }catch(e){}
})();
let t0=null;try{t0=LS.getItem('sg_th')}catch(e){}
theme(t0==='l');load();
if(me)start();else{$('#auth').classList.remove('hide');authMode(false)}
</script>
</body>
</html>
